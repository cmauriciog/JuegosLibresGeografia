/* =====================================================
   CRONOMETRO GLOBAL
===================================================== */

const DURACION_PARTIDA = 120;

let tiempoRestante = DURACION_PARTIDA;

let intervaloCronometro = null;


let juegoActivo = null;


/*
   Indica si hay una partida
   actualmente en ejecución.
*/

let partidaActiva = false;


/* =====================================================
   INICIAR CRONOMETRO
===================================================== */

function iniciarCronometro() {

    detenerCronometro();


    tiempoRestante =
        DURACION_PARTIDA;


    actualizarCronometro();


    document.getElementById(
        "cronometro"
    ).style.display = "block";


    intervaloCronometro =
        setInterval(
            function() {

                tiempoRestante--;


                actualizarCronometro();


                if(
                    tiempoRestante <= 0
                ){

                    tiempoRestante = 0;

                    actualizarCronometro();

                    detenerCronometro();

                    tiempoAgotado();

                }

            },
            1000
        );

}


/* =====================================================
   ACTUALIZAR CRONOMETRO
===================================================== */

function actualizarCronometro() {

    const minutos =
        Math.floor(
            tiempoRestante / 60
        );


    const segundos =
        tiempoRestante % 60;


    document.getElementById(
        "tiempo"
    ).textContent =

        minutos +
        ":" +
        String(segundos)
            .padStart(2,"0");

}


/* =====================================================
   DETENER CRONOMETRO
===================================================== */

function detenerCronometro() {

    if(
        intervaloCronometro
    ){

        clearInterval(
            intervaloCronometro
        );

        intervaloCronometro =
            null;

    }

}


/* =====================================================
   TIEMPO AGOTADO
===================================================== */

function tiempoAgotado() {

    if(!partidaActiva)
        return;


    partidaActiva = false;


    if(
        juegoActivo === "mapa"
    ){

        esperando = false;

        terminarPartida();

    }


    else if(
        juegoActivo === "capitales"
    ){

        capitalesRespondida = true;

        terminarRondaCapitales();

    }

}


/* =====================================================
   OCULTAR CRONOMETRO
===================================================== */

function comenzarCapitales() {

    const selectorContinente =
        document.getElementById("selectorContinenteCapitales");

    const selectorCantidad =
        document.getElementById("selectorCantidadCapitales");


    if (!selectorContinente) {
        console.error("No existe selectorContinenteCapitales");
        return;
    }

    if (!selectorCantidad) {
        console.error("No existe selectorCantidadCapitales");
        return;
    }


    const continente =
        selectorContinente.value.trim();

    const cantidad =
        selectorCantidad.value;


    console.log(
        "Iniciando Capitales:",
        continente,
        cantidad
    );


    // =====================================================
    // ACTIVAR JUEGO
    // =====================================================

    juegoActivo = "capitales";
    partidaActiva = true;

    continenteSeleccionado =
        continente;


    // =====================================================
    // OBTENER PAÍSES DISPONIBLES
    // =====================================================

    let disponibles;


    if (continente === "Mundo") {

        disponibles =
            basePaises.slice();

    } else {

        disponibles =
            basePaises.filter(function(pais) {

                return (
                    String(pais.continente).trim() ===
                    continente
                );

            });

    }


    console.log(
        "Países disponibles:",
        disponibles.length,
        disponibles
    );


    // =====================================================
    // VERIFICAR
    // =====================================================

    if (disponibles.length === 0) {

        alert(
            "No hay países disponibles para esta selección."
        );

        partidaActiva = false;

        return;
    }


    // =====================================================
    // MEZCLAR
    // =====================================================

    mezclarArray(disponibles);


    // =====================================================
    // CANTIDAD DE PREGUNTAS
    // =====================================================

    if (cantidad === "todos") {

        paisesPendientes =
            disponibles.slice();

    } else {

        const numero =
            parseInt(cantidad, 10);

        paisesPendientes =
            disponibles.slice(
                0,
                Math.min(
                    numero,
                    disponibles.length
                )
            );

    }


    // =====================================================
    // REINICIAR ESTADÍSTICAS
    // =====================================================

    aciertosCapital = 0;
    erroresCapital = 0;
    erroresCapitalDetalle = [];

    numeroPreguntaCapital = 0;

    capitalesRespondida = false;


    document.getElementById(
        "aciertosCapital"
    ).textContent = "0";


    document.getElementById(
        "erroresCapital"
    ).textContent = "0";


    document.getElementById(
        "erroresDetalle"
    ).innerHTML = "";


    // =====================================================
    // OCULTAR CONFIGURACIÓN
    // =====================================================

    document.getElementById(
        "seleccionContinente"
    ).style.display = "none";


    // =====================================================
    // MOSTRAR JUEGO
    // =====================================================

    document.getElementById(
        "numeroPregunta"
    ).style.display = "block";


    document.getElementById(
        "preguntaCapital"
    ).style.display = "block";


    document.querySelector(
        "#juegoCapitales .opciones"
    ).style.display = "flex";


    document.getElementById(
        "btnSiguiente"
    ).style.display = "block";


    document.getElementById(
        "finRonda"
    ).style.display = "none";


    // =====================================================
    // INICIAR CRONÓMETRO
    // =====================================================

    iniciarCronometro();

    siguienteCapital();

}

/* =====================================================
   MEZCLAR
===================================================== */

function mezclarArray(array) {

for (
let i = array.length - 1;
i > 0;
i--
) {

const j =
Math.floor(
Math.random() *
(i + 1)
);

[
array[i],
array[j]
] =
[
array[j],
array[i]
];

}

}


/* =====================================================
   SIGUIENTE CAPITAL
===================================================== */

function siguienteCapital() {

if(!partidaActiva)
return;


if (
paisesPendientes.length === 0
) {

terminarRondaCapitales();

return;

}


capitalesRespondida = false;


const botones =
document.querySelectorAll(
".opciones button"
);


botones.forEach(function(boton) {

boton.disabled = false;

boton.classList.remove(
"correcta"
);

boton.classList.remove(
"incorrecta"
);

});


document.getElementById(
"resultadoCapital"
).innerHTML = "";


capitalActual =
paisesPendientes.shift();


numeroPreguntaCapital++;


const total =
continenteSeleccionado === "Mundo"
? basePaises.length
: basePaises.filter(function(pais) {

return (
pais.continente ===
continenteSeleccionado
);

}).length;


document.getElementById(
"numeroPregunta"
).textContent =

"Pregunta " +
numeroPreguntaCapital +
" de " +
total;


document.getElementById(
"preguntaCapital"
).innerHTML =

"🏛️ ¿Cuál es la capital de " +

"<strong>" +

capitalActual.nombre +

"</strong>?";


let respuestas = [

capitalActual.capital

];


const candidatos =
basePaises.filter(function(pais) {

return (
pais.nombre !==
capitalActual.nombre &&

pais.capital !==
capitalActual.capital

);

});


mezclarArray(
candidatos
);


respuestas.push(
candidatos[0].capital
);

respuestas.push(
candidatos[1].capital
);


mezclarArray(
respuestas
);


opcionesCapitales =
respuestas;


respuestaCorrectaCapital =
respuestas.indexOf(
capitalActual.capital
);


for (
let i = 0;
i < 3;
i++
) {

document.getElementById(
"opcion" + i
).textContent =
respuestas[i];

}

}

/* =====================================================
   NOMBRE ESPAÑOL
===================================================== */
function nombreEspanol(nombre){
const normalizado =
normalizar(nombre);
return (
nombresGeoJSON[
normalizado
] ||
nombre
);
}
/* =====================================================
   COMPARAR PAÍSES
===================================================== */
function esMismoPais(
nombreMapa,
nombreObjetivo
){
const mapaEspanol =
nombreEspanol(
nombreMapa
);
return (
normalizar(mapaEspanol) ===
normalizar(nombreObjetivo)
);
}
/* =====================================================
   BARAJAR PAISES
===================================================== */
function barajar(array){
const copia =
[...array];
for(
let i=copia.length-1;
i>0;
i--
){
const j =
Math.floor(
Math.random() *
(i+1)
);
[
copia[i],
copia[j]
]=
[
copia[j],
copia[i]
];
}
return copia;
}
/* =====================================================
   CENTRAR MAPA
===================================================== */
function centrarContinente(
continente
){
const vista =
vistasContinentes[
continente
];
if(!vista)
return;
mapa.flyTo(
vista.centro,
vista.zoom,
{
animate:true,
duration:1
}
);
}
/* =====================================================
   MOSTRAR CONFIGURACION
===================================================== */
function mostrarConfiguracion(){
if(juegoActivo !== "mapa")
return;
partidaActiva = false;
esperando = false;
detenerCronometro();
ocultarCronometro();
document.getElementById(
"configuracion"
).style.display="block";
document.getElementById(
"panelJuego"
).style.display="none";
document.getElementById(
"resultado"
).style.display="none";
document.getElementById(
"map"
).style.display="block";
}
/* =====================================================
   COMENZAR PARTIDA PAISES
===================================================== */
function comenzarPartida(){
if(!capaPaises){
alert(
"El mapa todavía está cargando."
);
return;
}
const continente =
document.getElementById(
"selectorContinente"
).value;
const cantidad =
document.getElementById(
"selectorCantidad"
).value;
let disponibles;
if (
    continente === "Todos"
) {

    disponibles =
        [...paises];

}
else {

    /*
     * Equivalencias entre los nombres
     * usados por el selector y la base.
     */

    const equivalenciasContinente = {

        "América del Norte":
            "Norteamérica",

        "América Central":
            "Centroamérica y Caribe",

        "Caribe":
            "Centroamérica y Caribe",

        "América del Sur":
            "Sudamérica",

        "Europa":
            "Europa",

        "África":
            "África",

        "Asia":
            "Asia",

        "Oceanía":
            "Oceanía"

    };


    const continenteBase =
        equivalenciasContinente[
            continente
        ] || continente;


    disponibles =
        paises.filter(
            function(pais) {

                return (
                    pais[2] ===
                    continenteBase
                );

            }
        );

}
if (disponibles.length === 0) {

    console.error(
        "No hay preguntas para el continente:",
        continente
    );

    alert(
        "No hay países disponibles para esta selección."
    );

    return;
}
disponibles =
barajar(disponibles);
if(cantidad==="todos"){
partida =
disponibles;
}
else{
const numero =
parseInt(cantidad);
partida =
disponibles.slice(
0,
Math.min(
numero,
disponibles.length
)
);
}
indice=0;
aciertos=0;
errores=0;
erroresDetalle=[];
esperando=true;
partidaActiva=true;
juegoActivo="mapa";
capaPaises.eachLayer(
layer => {
layer.setStyle({
color:"#777",
weight:1,
fillColor:"#ffffff",
fillOpacity:.85
});
layer.closeTooltip();
}
);
document.getElementById(
"configuracion"
).style.display="none";
document.getElementById(
"panelJuego"
).style.display="block";
document.getElementById(
"resultado"
).style.display="none";
document.getElementById(
"botonNueva"
).style.display="block";
centrarContinente(
continente
);
actualizarMarcadores();
/*
   Iniciar los 2 minutos.
*/
iniciarCronometro();
mostrarPregunta();
}


/* =====================================================
   MOSTRAR PREGUNTA MAPA
===================================================== */
function mostrarPregunta(){
if(!partidaActiva)
return;
if(
indice>=partida.length
){
terminarPartida();
return;
}
const pais =
partida[indice][0];
const continente =
partida[indice][1];
document.getElementById(
"objetivo"
).textContent =
"🎯 Encontrá: " + pais;
document.getElementById(
"continente"
).textContent =
"Continente: " + continente;
document.getElementById(
"numero"
).textContent =
indice+1;
esperando=true;
}
/* =====================================================
   SELECCIONAR PAIS
===================================================== */
function seleccionarPais(layer){
if(!partidaActiva)
return;
if(!esperando)
return;
const paisObjetivo =
partida[indice][0];
const continente =
partida[indice][1];
const paisElegido =
layer.nombrePais ||
"Desconocido";
const correcto =
esMismoPais(
paisElegido,
paisObjetivo
);
layer.setStyle({
fillColor:"#999999",
fillOpacity:.95,
color:"#444",
weight:2
});
esperando=false;
if(correcto){
aciertos++;
layer.bindTooltip(
"✅ ¡Correcto!",
{
permanent:false
}
).openTooltip();
}
else{
errores++;
erroresDetalle.push({
objetivo:paisObjetivo,
elegido:paisElegido,
continente:continente
});
layer.bindTooltip(
"❌ Incorrecto",
{
permanent:false
}
).openTooltip();
}
actualizarMarcadores();
/*
   IMPORTANTE:

   Si el tiempo termina durante
   estos 700 ms, no avanzamos
   la partida.
*/
setTimeout(
function(){
if(!partidaActiva)
return;
indice++;
mostrarPregunta();
actualizarMarcadores();
},
700
);
}
/* =====================================================
   MARCADORES MAPA
===================================================== */
function actualizarMarcadores(){
document.getElementById(
"numero"
).textContent =
Math.min(
indice+1,
partida.length
);
document.getElementById(
"aciertos"
).textContent =
aciertos;
document.getElementById(
"errores"
).textContent =
errores;
}
/* =====================================================
   FINAL MAPA
===================================================== */
function terminarPartida(){
if(
!partidaActiva &&
document.getElementById(
"resultado"
).style.display === "flex"
){
return;
}
partidaActiva=false;
esperando=false;
detenerCronometro();
const total =
partida.length;
const respondidas =
aciertos +
errores;
const porcentaje =
respondidas>0
? Math.round(
aciertos/respondidas*100
)
:0;
document.getElementById(
"resumen"
).innerHTML =

"<p>" +

"<b>" +
aciertos +
"</b> aciertos de " +
respondidas +
"</p>" +
"<p>🎯 Precisión: <b>" +
porcentaje +
"%</b></p>" +
"<p>❌ Errores: <b>" +
errores +
"</b></p>" +
"<p>📝 Preguntas respondidas: <b>" +
respondidas +
"</b></p>";
const detalle =
document.getElementById(
"detalle"
);
if(errores===0){
detalle.innerHTML =
"<p class='correcto'>" +
"🎉 ¡Excelente!<br>" +
"No cometiste ningún error." +
"</p>";
}
else{
let html =
"<h3>" +
"Países en los que te equivocaste" +
"</h3>";
erroresDetalle.forEach(
function(error,i){
html +=
"<div class='error'>" +
"<b>" +
(i+1) +
". " +
error.objetivo +
"</b><br>" +
"Continente: " +
error.continente +
"<br>" +
"Elegiste: " +
"<span class='incorrecto'>" +
error.elegido +
"</span>" +
"</div>";
}
);
detalle.innerHTML =
html;
}
if(tiempoRestante === 0){
document.getElementById(
"resultadoCaja"
).querySelector("h2")
.textContent =
"⏱️ ¡Tiempo agotado!";
}
else{
document.getElementById(
"resultadoCaja"
).querySelector("h2")
.textContent =
"🏁 Partida terminada";
}
document.getElementById(
"resultado"
).style.display="flex";
}
function aplicarRestriccionVersion() {

    const selector = document.getElementById("selectorContinente");
	const selectorcapitales = document.getElementById("selectorContinenteCapitales");

    if (!selector) return;

    const esPro = window.dqcEsPro === true;


    if (!esPro) {

        // ==========================
        // VERSIÓN LIBRE
        // ==========================

        selector.value = "América del Sur";
		selectorcapitales.value = "Sudamérica";

        Array.from(selector.options).forEach(option => {
            if (option.value === "América del Sur") {
                option.hidden = false;
                option.disabled = false;
            } else {
                option.hidden = true;
                option.disabled = true;
            }
        });
		Array.from(selectorcapitales.options).forEach(option => {
            if (option.value === "Sudamérica") {
                option.hidden = false;
                option.disabled = false;
            } else {
                option.hidden = true;
                option.disabled = true;
            }
        });

    } else {
        // ==========================
        // VERSIÓN PRO
        // ==========================
        Array.from(selector.options).forEach(option => {
            option.hidden = false;
            option.disabled = false;
        });
		Array.from(selectorcapitales.options).forEach(option => {
            option.hidden = false;
            option.disabled = false;
        });
    }
}
volverMenu();
document.addEventListener("DOMContentLoaded", function () {
    aplicarRestriccionVersion();
});
