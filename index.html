<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejemplo</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: #FFC477;
            font-family: Arial, sans-serif;
        }

        button {
            width: 220px;
            padding: 15px;
            margin: 10px;

            font-size: 18px;
            border: none;
            border-radius: 10px;

            background-color: #E66F00;
            color: white;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <button onclick="mostrarMensaje1()">
        Botón 1
    </button>

    <button onclick="mostrarMensaje2()">
        Botón 2
    </button>

    <script>

        function mostrarMensaje1() {
            alert("Este es el mensaje del botón 1");
        }

        function mostrarMensaje2() {
            alert("Este es el mensaje del botón 2");
        }

    </script>

</body>
</html>
