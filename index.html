<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Adivinar el país</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f6f1e8;
    color:#333;
}

header{
    background:#e58b3a;
    color:white;
    text-align:center;
    padding:12px;
}

header h1{
    margin:0;
    font-size:24px;
}

#configuracion{
    background:white;
    padding:15px;
    text-align:center;
}

#configuracion h2{
    margin:0 0 12px;
    font-size:20px;
}

select{
    padding:10px;
    border-radius:8px;
    border:1px solid #aaa;
    font-size:16px;
    margin:5px;
    background:white;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 18px;
    margin:8px 4px;
    background:#e58b3a;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#c96f20;
}

#panelJuego{
    display:none;
    background:white;
    padding:10px;
    text-align:center;
}

#objetivo{
    font-size:24px;
    font-weight:bold;
}

#continente{
    color:#777;
    margin:5px;
}

#marcadores{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    font-weight:bold;
}

#map{
    width:100%;
    height:calc(100vh - 230px);
    min-height:400px;
}

#resultado{
    display:none;
    position:fixed;
    z-index:5000;
    inset:0;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
    padding:20px;
}

#resultadoCaja{
    background:white;
    border-radius:15px;
    padding:22px;
    width:min(520px,100%);
    max-height:85vh;
    overflow:auto;
    text-align:center;
}

#resultadoCaja h2{
    margin-top:0;
}

.error{
    text-align:left;
    border-bottom:1px solid #ddd;
    padding:9px;
}

.correcto{
    color:#16803c;
}

.incorrecto{
    color:#c5221f;
}

#botonNueva{
    display:none;
}

</style>

</head>

<body>


<header>

<h1>🌎 Adivinar el país</h1>

</header>


<!-- =====================================================
     CONFIGURACIÓN
===================================================== -->

<div id="configuracion">

<h2>🎮 Configurá la partida</h2>


<div>

<label>
Continente:
</label>

<select id="selectorContinente">

<option value="Todos">
🌎 Todos
</option>

<option value="América del Norte">
🌎 América del Norte
</option>

<option value="América Central">
🌴 América Central
</option>

<option value="Caribe">
🏝️ Caribe
</option>

<option value="América del Sur">
🌎 América del Sur
</option>

<option value="Europa">
🇪🇺 Europa
</option>

<option value="África">
🌍 África
</option>

<option value="Asia">
🌏 Asia
</option>

<option value="Oceanía">
🦘 Oceanía
</option>

</select>

</div>


<div>

<label>
Preguntas:
</label>

<select id="selectorCantidad">

<option value="10">
10
</option>

<option value="20">
20
</option>

<option value="50">
50
</option>

<option value="todos">
Todos
</option>

</select>

</div>


<br>


<button onclick="comenzarPartida()">

▶️ Comenzar partida

</button>

</div>



<!-- =====================================================
     PANEL DEL JUEGO
===================================================== -->

<div id="panelJuego">

<div id="objetivo">
Encontrá el país
</div>

<div id="continente"></div>


<div id="marcadores">

<span>
🌎 Pregunta:
<b id="numero">0</b>
</span>

<span>
✅ Aciertos:
<b id="aciertos">0</b>
</span>

<span>
❌ Errores:
<b id="errores">0</b>
</span>

</div>


<button
id="botonNueva"
onclick="mostrarConfiguracion()">

⚙️ Nueva partida

</button>

</div>



<!-- =====================================================
     MAPA
===================================================== -->

<div id="map"></div>



<!-- =====================================================
     RESULTADO
===================================================== -->

<div id="resultado">

<div id="resultadoCaja">

<h2>🏁 Partida terminada</h2>

<div id="resumen"></div>

<div id="detalle"></div>


<button onclick="mostrarConfiguracion()">

🎮 Jugar nuevamente

</button>

</div>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

["Australia","Oceanía"],
["Fiyi","Oceanía"],
["Kiribati","Oceanía"],
["Islas Marshall","Oceanía"],

["Nauru","Oceanía"],
["Nueva Zelanda","Oceanía"],
["Palaos","Oceanía"],
["Papúa Nueva Guinea","Oceanía"],
["Samoa","Oceanía"],
["Islas Salomón","Oceanía"],
["Tonga","Oceanía"],
["Tuvalu","Oceanía"],
["Vanuatu","Oceanía"]

];


/* =====================================================
   VARIABLES
===================================================== */

let mapa;

let capaPaises;

let partida=[];

let indice=0;

let aciertos=0;

let errores=0;

let erroresDetalle=[];

let esperando=false;



/* =====================================================
   CENTROS Y ZOOM
===================================================== */

const vistasContinentes = {

    "Todos":{
        centro:[20,0],
        zoom:2
    },

    "América del Norte":{
        centro:[45,-100],
        zoom:3
    },

    "América Central":{
        centro:[15,-85],
        zoom:5
    },

    "Caribe":{
        centro:[20,-75],
        zoom:5
    },

    "América del Sur":{
        centro:[-15,-60],
        zoom:3
    },

    "Europa":{
        centro:[50,15],
        zoom:4
    },

    "África":{
        centro:[5,20],
        zoom:3
    },

    "Asia":{
        centro:[35,90],
        zoom:3
    },

    "Oceanía":{
        centro:[-20,140],
        zoom:3
    }

};



/* =====================================================
   CREAR MAPA
===================================================== */

mapa = L.map(
    "map",
    {
        minZoom:1,
        maxZoom:7,
        worldCopyJump:false
    }
).setView(
    [20,0],
    2
);



/* =====================================================
   CARGAR GEOJSON
===================================================== */

fetch(
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
)

.then(
respuesta => respuesta.json()
)

.then(
datos => {

    capaPaises =
        L.geoJSON(
            datos,
            {

                style:{

                    color:"#777",

                    weight:1,

                    fillColor:"#ffffff",

                    fillOpacity:.85

                },


                onEachFeature:
                function(feature,layer){

                    layer.nombrePais =
                        obtenerNombre(feature);


                    layer.on(
                        "click",
                        function(){

                            seleccionarPais(layer);

                        }
                    );


                    layer.on(
                        "mouseover",
                        function(){

                            if(!esperando)
                                return;

                            layer.setStyle({

                                weight:2,

                                color:"#444"

                            });

                        }
                    );


                    layer.on(
                        "mouseout",
                        function(){

                            if(!esperando)
                                return;

                            layer.setStyle({

                                weight:1,

                                color:"#777"

                            });

                        }
                    );

                }

            }
        )
        .addTo(mapa);

}

)

.catch(
error => {

    console.error(error);

    document.getElementById(
        "objetivo"
    ).textContent =
        "⚠️ No se pudo cargar el mapa";

}
);



/* =====================================================
   NOMBRE
===================================================== */

function obtenerNombre(feature){

    const p =
        feature.properties || {};

    return (

        p.ADMIN ||

        p.NAME ||

        p.NAME_LONG ||

        p.name ||

        ""

    );

}



/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto){

    return String(texto)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .replace(
            /[^a-z0-9]/g,
            ""
        );

}



/* =====================================================
   COMPARAR PAÍSES
===================================================== */

function esMismoPais(
    nombreMapa,
    nombreObjetivo
){

    const a =
        normalizar(nombreMapa);

    const b =
        normalizar(nombreObjetivo);


    if(a===b)
        return true;


    const equivalencias={

        "unitedstates":
        "estadosunidos",

        "unitedstatesofamerica":
        "estadosunidos",

        "russianfederation":
        "rusia",

        "russia":
        "rusia",

        "czechia":
        "republicacheca",

        "czechrepublic":
        "republicacheca",

        "unitedkingdom":
        "reinounido",

        "southkorea":
        "coreadelsur",

        "republicofkorea":
        "coreadelsur",

        "northkorea":
        "coreadelnorte",

        "democraticpeoplesrepublicofkorea":
        "coreadelnorte",

        "turkey":
        "turquia",

        "timorleste":
        "timororiental",

        "swaziland":
        "esuatini",

        "capeverde":
        "caboverde",

        "ivorycoast":
        "costademarfil",

        "cotedivoire":
        "costademarfil",

        "democraticrepublicofthecongo":
        "republicademocraticadelcongo",

        "republicofthecongo":
        "republicadelcongo",

        "centralafricanrepublic":
        "republicacentroafricana",

        "equatorialguinea":
        "guineaecuatorial",

        "southsudan":
        "sudandelsur",

        "marshallislands":
        "islasmarshall",

        "solomonislands":
        "islassalomon"

    };


    return (

        equivalencias[a]===b ||

        equivalencias[b]===a

    );

}



/* =====================================================
   BARAJAR
===================================================== */

function barajar(array){

    const copia =
        [...array];


    for(
        let i=copia.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );


        [
            copia[i],
            copia[j]
        ]=
        [
            copia[j],
            copia[i]
        ];

    }


    return copia;

}



/* =====================================================
   CENTRAR MAPA SEGÚN CONTINENTE
===================================================== */

function centrarContinente(
    continente
){

    const vista =
        vistasContinentes[
            continente
        ];


    if(!vista)
        return;


    mapa.flyTo(

        vista.centro,

        vista.zoom,

        {
            animate:true,
            duration:1
        }

    );

}



/* =====================================================
   MOSTRAR CONFIGURACIÓN
===================================================== */

function mostrarConfiguracion(){

    esperando=false;


    document.getElementById(
        "configuracion"
    ).style.display="block";


    document.getElementById(
        "panelJuego"
    ).style.display="none";


    document.getElementById(
        "resultado"
    ).style.display="none";

}



/* =====================================================
   COMENZAR PARTIDA
===================================================== */

function comenzarPartida(){

    if(!capaPaises){

        alert(
            "El mapa todavía está cargando."
        );

        return;

    }


    const continente =
        document.getElementById(
            "selectorContinente"
        ).value;


    const cantidad =
        document.getElementById(
            "selectorCantidad"
        ).value;


    let disponibles;


    if(
        continente==="Todos"
    ){

        disponibles =
            [...paises];

    }else{

        disponibles =
            paises.filter(
                pais =>
                    pais[1]===continente
            );

    }


    /*
      Mezclamos antes de seleccionar
      las preguntas.
    */

    disponibles =
        barajar(disponibles);


    if(cantidad==="todos"){

        partida =
            disponibles;

    }else{

        const numero =
            parseInt(cantidad);


        partida =
            disponibles.slice(
                0,
                Math.min(
                    numero,
                    disponibles.length
                )
            );

    }


    indice=0;

    aciertos=0;

    errores=0;

    erroresDetalle=[];

    esperando=true;


    /*
      Restaurar colores.
    */

    capaPaises.eachLayer(
        layer => {

            layer.setStyle({

                color:"#777",

                weight:1,

                fillColor:"#ffffff",

                fillOpacity:.85

            });

            layer.closeTooltip();

        }
    );


    /*
      Ocultar configuración.
    */

    document.getElementById(
        "configuracion"
    ).style.display="none";


    document.getElementById(
        "panelJuego"
    ).style.display="block";


    /*
      Centrar el mapa según el continente.
    */

    centrarContinente(
        continente
    );


    actualizarMarcadores();

    mostrarPregunta();

}



/* =====================================================
   MOSTRAR PREGUNTA
===================================================== */

function mostrarPregunta(){

    if(
        indice>=partida.length
    ){

        terminarPartida();

        return;

    }


    const pais =
        partida[indice][0];


    const continente =
        partida[indice][1];


    document.getElementById(
        "objetivo"
    ).textContent =
        "🎯 Encontrá: " + pais;


    document.getElementById(
        "continente"
    ).textContent =
        "Continente: " + continente;


    document.getElementById(
        "numero"
    ).textContent =
        indice+1;


    esperando=true;

}



/* =====================================================
   SELECCIONAR PAÍS
===================================================== */

function seleccionarPais(layer){

    if(!esperando)
        return;


    const paisObjetivo =
        partida[indice][0];


    const continente =
        partida[indice][1];


    const paisElegido =
        layer.nombrePais ||
        "Desconocido";


    const correcto =
        esMismoPais(
            paisElegido,
            paisObjetivo
        );


    /*
      Siempre se pinta gris.
    */

    layer.setStyle({

        fillColor:"#999999",

        fillOpacity:.95,

        color:"#444",

        weight:2

    });


    esperando=false;


    if(correcto){

        aciertos++;


        layer.bindTooltip(
            "✅ ¡Correcto!",
            {
                permanent:false
            }
        ).openTooltip();


    }else{

        errores++;


        erroresDetalle.push({

            objetivo:paisObjetivo,

            elegido:paisElegido,

            continente:continente

        });


        layer.bindTooltip(
            "❌ Incorrecto",
            {
                permanent:false
            }
        ).openTooltip();

    }


    actualizarMarcadores();


    setTimeout(
        function(){

            indice++;

            mostrarPregunta();

            actualizarMarcadores();

        },
        700
    );

}



/* =====================================================
   MARCADORES
===================================================== */

function actualizarMarcadores(){

    document.getElementById(
        "numero"
    ).textContent =
        Math.min(
            indice+1,
            partida.length
        );


    document.getElementById(
        "aciertos"
    ).textContent =
        aciertos;


    document.getElementById(
        "errores"
    ).textContent =
        errores;

}



/* =====================================================
   FINAL
===================================================== */

function terminarPartida(){

    esperando=false;


    const total =
        partida.length;


    const porcentaje =
        total>0
        ? Math.round(
            aciertos/total*100
          )
        : 0;


    document.getElementById(
        "resumen"
    ).innerHTML =

        "<p>" +

        "<b>" +
        aciertos +
        "</b> aciertos de " +
        total +

        "</p>" +

        "<p>🎯 Precisión: <b>" +

        porcentaje +

        "%</b></p>" +

        "<p>❌ Errores: <b>" +

        errores +

        "</b></p>";


    const detalle =
        document.getElementById(
            "detalle"
        );


    if(errores===0){

        detalle.innerHTML =

            "<p class='correcto'>" +

            "🎉 ¡Excelente!<br>" +

            "No cometiste ningún error." +

            "</p>";

    }else{

        let html =

            "<h3>" +

            "Países en los que te equivocaste" +

            "</h3>";


        erroresDetalle.forEach(
            function(error,i){

                html +=

                "<div class='error'>" +

                "<b>" +

                (i+1) +

                ". " +

                error.objetivo +

                "</b><br>" +

                "Continente: " +

                error.continente +

                "<br>" +

                "Elegiste: " +

                "<span class='incorrecto'>" +

                error.elegido +

                "</span>" +

                "</div>";

            }
        );


        detalle.innerHTML =
            html;

    }


    document.getElementById(
        "resultado"
    ).style.display="flex";

}

</script>
