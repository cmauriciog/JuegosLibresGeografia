<style>

*{

html,body{

/* =====================================================
   INICIO
===================================================== */

}

    height:100%;

}

.inicioPanel{

    width:min(92%,760px);

    padding:25px;

    background:
        rgba(255,255,255,.95);

}

.inicioPanel h1{

}

.inicioPanel p{

    color:#607d8b;

    font-size:18px;
}

#continentes{

}

.botonContinente{

}

}


/* =====================================================
   JUEGO
===================================================== */

#juego{
    display:none;

    position:fixed;

    inset:0;

    flex-direction:column;
}

header{

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:

}

#titulo{

}

#datos{

}

}

@keyframes parpadeo{

}

#contenido{

}


/* =====================================================
   MAPA
===================================================== */

#zonaMapa{

    overflow:hidden;

    background:#dff0f5;
}

#mapa{

}

#mapa.arrastrando{
    cursor:grabbing;
}

#volver,
#zoomInfo{

    z-index:50;

    border:none;

    border-radius:8px;

    padding:
        8px 12px;

        rgba(
            255,

#volver{

}

}

#mensaje{

    display:none;

    background:
        rgba(

}


/* =====================================================
   PAÍSES
===================================================== */

.destino{

        rgba(

            255,
            .18
        );

}


/*
   País correcto
*/

.destino.correcto{

/* =====================================================
   PANEL
===================================================== */

#panel{

.resultado{

/* =====================================================

<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */


const SVG_NS=
"http://www.w3.org/2000/svg";


const ANCHO=900;

const ALTO=700;


/* =====================================================
   PAÍSES
===================================================== */

const SUDAMERICA={

    ARG:"Argentina",

    BOL:"Bolivia",

    BRA:"Brasil",

    CHL:"Chile",

    COL:"Colombia",

    ECU:"Ecuador",

    GUY:"Guyana",

    PRY:"Paraguay",

    PER:"Perú",

    SUR:"Surinam",

    URY:"Uruguay",

    VEN:"Venezuela"

};


/* =====================================================
   VARIABLES
===================================================== */

//let geojson=null;
let geojson=sudamerica;

let paises={};

let datosPais={};

let timer=null;

let segundos=120;

let aciertos=0;

let errores=0;

let juegoActivo=false;


/*
   Guardamos el detalle de cada error.

   Ejemplo:

   {
       codigo:"ARG",
       correcto:"Argentina",
       colocado:"Chile"
   }
*/

let detallesErrores=[];


/* Arrastre */

let arrastre=null;


/* Vista */

let vista={

    x:0,

    y:0,

    w:900,

    h:700

};


/* Transformación geográfica */

let transformacion=null;


/* Puntero del mapa */

let mapaPointer=null;


/* Dedos */

let dedos=new Map();

let pinch=null;


/* =====================================================
   ELEMENTOS
===================================================== */

const svg=
document.getElementById("mapa");


const piezas=
document.getElementById("paises");


/* =====================================================
   CARGAR MAPA
===================================================== */

async function cargarGeoJSON() {

    try {

        //geojson = sudamerica;

        //console.log(
        //    "GeoJSON cargado:",
        //    geojson
        //);

        crearFondoMundo();

        document
            .getElementById("cargando")
            .style.display = "none";

    } catch (error) {

        console.error(
            "Error cargando GeoJSON:",
            error
        );

        document
            .getElementById("cargando")
            .innerHTML =
                "No se pudo cargar el mapa.<br><br>" +
                error.message;

    }

}


/* =====================================================
   PROYECCIÓN
===================================================== */

function proyectarMundo(
    lon,
    lat
){

    return [

        (lon+180)*
        1000/360,

        (90-lat)*
        500/180

    ];

}


/* =====================================================
   GEOMETRÍA FONDO
===================================================== */

function convertirGeometryMundo(
    geometry
){

    let d="";


    function anillo(ring){

        ring.forEach(
            (c,i)=>{

                const p=
                    proyectarMundo(
                        c[0],
                        c[1]
                    );


                d+=
                    (i?"L":"M")+
                    p[0]+" "+
                    p[1]+" ";

            }
        );


        d+="Z ";

    }


    if(
        geometry.type==="Polygon"
    ){

        geometry.coordinates
        .forEach(anillo);

    }


    else if(
        geometry.type==="MultiPolygon"
    ){

        geometry.coordinates
        .forEach(
            poligono=>{

                poligono.forEach(
                    anillo
                );

            }
        );

    }


    return d;

}


/* =====================================================
   FONDO MUNDO
===================================================== */

function crearFondoMundo(){

    const fondo=
        document.getElementById(
            "fondoMundo"
        );


    fondo.innerHTML="";


    geojson.features.forEach(
        feature=>{

            if(!feature.geometry)
                return;


            const path=
                document.createElementNS(
                    SVG_NS,
                    "path"
                );


            path.setAttribute(
                "d",
                convertirGeometryMundo(
                    feature.geometry
                )
            );


            path.classList.add(
                "mundoPais"
            );


            fondo.appendChild(
                path
            );

        }
    );

}


/* =====================================================
   SELECCIONAR CONTINENTE
===================================================== */

function seleccionarContinente(
    continente
){

    if(
        continente!=="Sudamérica"
    ){

        document
        .getElementById("aviso")
        .style.display="flex";

        return;

    }


    document
    .getElementById("inicio")
    .style.display="none";


    document
    .getElementById("juego")
    .style.display="flex";


    prepararSudamerica();

}


/* =====================================================
   CÓDIGO PAÍS
===================================================== */

function obtenerCodigo(
    feature
){

    const p=
        feature.properties||{};


    return (

        p.ADM0_A3||

        p.ISO_A3||

        p.SOV_A3||

        ""

    ).toUpperCase();

}


/* =====================================================
   RECORRER COORDENADAS
===================================================== */

function recorrerCoordenadas(
    coordenadas,
    callback
){

    if(
        typeof coordenadas[0]
        ==="number"
    ){

        callback(
            coordenadas
        );

        return;

    }


    coordenadas.forEach(
        elemento=>{

            recorrerCoordenadas(
                elemento,
                callback
            );

        }
    );

}


/* =====================================================
   PREPARAR SUDAMÉRICA
===================================================== */

function prepararSudamerica(){

    paises={
        ...SUDAMERICA
    };


    datosPais={};


    svg.innerHTML="";


    const features=
        geojson.features.filter(
            feature=>{

                const codigo=
                    obtenerCodigo(
                        feature
                    );


                return !!paises[codigo];

            }
        );


    let minLon=Infinity;

    let maxLon=-Infinity;

    let minLat=Infinity;

    let maxLat=-Infinity;


    features.forEach(
        feature=>{

            recorrerCoordenadas(
                feature.geometry.coordinates,

                c=>{

                    minLon=
                        Math.min(
                            minLon,
                            c[0]
                        );


                    maxLon=
                        Math.max(
                            maxLon,
                            c[0]
                        );


                    minLat=
                        Math.min(
                            minLat,
                            c[1]
                        );


                    maxLat=
                        Math.max(
                            maxLat,
                            c[1]
                        );

                }
            );

        }
    );


    const margenX=
        (
            maxLon-minLon
        )*.06;


    const margenY=
        (
            maxLat-minLat
        )*.06;


    minLon-=margenX;

    maxLon+=margenX;

    minLat-=margenY;

    maxLat+=margenY;


    const escala=
        Math.min(

            (ANCHO-60)/
            (maxLon-minLon),

            (ALTO-60)/
            (maxLat-minLat)

        );


    const anchoReal=
        (maxLon-minLon)*
        escala;


    const altoReal=
        (maxLat-minLat)*
        escala;


    const offsetX=
        (ANCHO-anchoReal)/2;


    const offsetY=
        (ALTO-altoReal)/2;


    transformacion={

        minLon,

        maxLon,

        minLat,

        maxLat,

        escala,

        offsetX,

        offsetY

    };


    function proyectar(
        lon,
        lat
    ){

        return [

            offsetX+
            (
                lon-minLon
            )*
            escala,

            ALTO-
            (
                offsetY+
                (
                    lat-minLat
                )*
                escala
            )

        ];

    }


    features.forEach(
        feature=>{

            const codigo=
                obtenerCodigo(
                    feature
                );


            datosPais[codigo]={

                codigo,

                nombre:
                    paises[codigo],

                geometry:
                    feature.geometry,

                path:
                    geometryToPath(
                        feature.geometry,
                        proyectar
                    )

            };

        }
    );


    crearDestinos();


    nuevoJuego();

}


/* =====================================================
   PATH
===================================================== */

function geometryToPath(
    geometry,
    proyectar
){

    let d="";


    function anillo(ring){

        ring.forEach(
            (c,i)=>{

                const p=
                    proyectar(
                        c[0],
                        c[1]
                    );


                d+=
                    (i?"L":"M")+
                    p[0].toFixed(2)+
                    " "+
                    p[1].toFixed(2)+
                    " ";

            }
        );


        d+="Z ";

    }


    if(
        geometry.type==="Polygon"
    ){

        geometry.coordinates
        .forEach(anillo);

    }


    else if(
        geometry.type==="MultiPolygon"
    ){

        geometry.coordinates
        .forEach(
            poligono=>{

                poligono.forEach(
                    anillo
                );

            }
        );

    }


    return d;

}


/* =====================================================
   DESTINOS
===================================================== */

function crearDestinos(){

    Object.values(
        datosPais
    ).forEach(
        pais=>{

            const path=
                document.createElementNS(
                    SVG_NS,
                    "path"
                );


            path.setAttribute(
                "d",
                pais.path
            );


            path.dataset.codigo=
                pais.codigo;


            path.classList.add(
                "destino"
            );


            svg.appendChild(
                path
            );

        }
    );

}


/* =====================================================
   VISTA
===================================================== */

function aplicarVista(){

    svg.setAttribute(
        "viewBox",

        `${vista.x} ${
            vista.y
        } ${
            vista.w
        } ${
            vista.h
        }`
    );


    const zoom=
        900/vista.w;


    document
    .getElementById("zoomInfo")
    .textContent=
        "Zoom: "+
        zoom.toFixed(1)+
        "×";

}


/* =====================================================
   LIMITAR VISTA
===================================================== */

function limitarVista(){

    const minW=
        900/6;


    const minH=
        700/6;


    vista.w=
        Math.max(
            minW,
            Math.min(
                900,
                vista.w
            )
        );


    vista.h=
        Math.max(
            minH,
            Math.min(
                700,
                vista.h
            )
        );


    vista.x=
        Math.max(
            0,
            Math.min(
                900-vista.w,
                vista.x
            )
        );


    vista.y=
        Math.max(
            0,
            Math.min(
                700-vista.h,
                vista.y
            )
        );

}


/* =====================================================
   REINICIAR VISTA
===================================================== */

function reiniciarVista(){

    vista={

        x:0,

        y:0,

        w:900,

        h:700

    };


    aplicarVista();

}


/* =====================================================
   ZOOM
===================================================== */

function hacerZoom(
    factor,
    cx,
    cy
){

    const nuevoW=
        vista.w/factor;


    const nuevoH=
        vista.h/factor;


    vista.x=
        cx-
        (
            cx-vista.x
        )*
        (
            nuevoW/
            vista.w
        );


    vista.y=
        cy-
        (
            cy-vista.y
        )*
        (
            nuevoH/
            vista.h
        );


    vista.w=
        nuevoW;


    vista.h=
        nuevoH;


    limitarVista();


    aplicarVista();

}


/* =====================================================
   CLIENT → SVG
===================================================== */

function obtenerPuntoSVG(
    clientX,
    clientY
){

    const rect=
        svg.getBoundingClientRect();


    return {

        x:
            vista.x+
            (
                clientX-
                rect.left
            )*
            vista.w/
            rect.width,


        y:
            vista.y+
            (
                clientY-
                rect.top
            )*
            vista.h/
            rect.height

    };

}


/* =====================================================
   DETECTAR PAÍS BAJO EL NOMBRE
===================================================== */

function detectarPaisBajoNombre(
    x,
    y
){

    /*
       Buscamos primero el país que
       contiene exactamente el centro.
    */

    const centro=
        convertirSVGaGeo(
            x,
            y
        );


    for(
        const codigo of
        Object.keys(datosPais)
    ){

        const pais=
            datosPais[codigo];


        if(
            puntoEnGeometry(
                centro.lon,
                centro.lat,
                pais.geometry
            )
        ){

            return codigo;

        }

    }


    /*
       Si el centro cae fuera,
       comprobamos varios puntos.
       Esto ayuda con países pequeños.
    */

    const puntos=[

        [x-8,y],

        [x+8,y],

        [x,y-8],

        [x,y+8],

        [x-12,y-5],

        [x+12,y-5],

        [x-12,y+5],

        [x+12,y+5]

    ];


    for(
        const punto of puntos
    ){

        const geo=
            convertirSVGaGeo(
                punto[0],
                punto[1]
            );


        for(
            const codigo of
            Object.keys(datosPais)
        ){

            if(
                puntoEnGeometry(
                    geo.lon,
                    geo.lat,
                    datosPais[codigo].geometry
                )
            ){

                return codigo;

            }

        }

    }


    return null;

}


/* =====================================================
   MAPA - ARRASTRE
===================================================== */

svg.addEventListener(
    "pointerdown",
    function(e){

        if(arrastre)
            return;


        if(
            e.pointerType==="touch"
        ){

            dedos.set(
                e.pointerId,
                {
                    x:e.clientX,
                    y:e.clientY
                }
            );

        }


        if(!mapaPointer){

            mapaPointer={

                id:e.pointerId,

                x:e.clientX,

                y:e.clientY,

                vistaX:vista.x,

                vistaY:vista.y

            };


            svg.classList.add(
                "arrastrando"
            );

        }


        e.preventDefault();

    },
    {passive:false}
);


svg.addEventListener(
    "pointermove",
    function(e){

        if(arrastre)
            return;


        if(
            mapaPointer &&
            mapaPointer.id===
            e.pointerId
        ){

            const rect=
                svg.getBoundingClientRect();


            const dx=
                (
                    e.clientX-
                    mapaPointer.x
                )*
                vista.w/
                rect.width;


            const dy=
                (
                    e.clientY-
                    mapaPointer.y
                )*
                vista.h/
                rect.height;


            vista.x=
                mapaPointer.vistaX-
                dx;


            vista.y=
                mapaPointer.vistaY-
                dy;


            limitarVista();

            aplicarVista();

        }


        e.preventDefault();

    },
    {passive:false}
);


function terminarMapa(e){

    if(
        mapaPointer &&
        mapaPointer.id===
        e.pointerId
    ){

        mapaPointer=null;

        svg.classList.remove(
            "arrastrando"
        );

    }

}


svg.addEventListener(
    "pointerup",
    terminarMapa
);


svg.addEventListener(
    "pointercancel",
    terminarMapa
);


/* =====================================================
   ZOOM RUEDA
===================================================== */

svg.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();


        const p=
            obtenerPuntoSVG(
                e.clientX,
                e.clientY
            );


        hacerZoom(

            e.deltaY<0
            ?1.25
            :.8,

            p.x,

            p.y

        );

    },
    {passive:false}
);


/* =====================================================
   DOBLE CLICK
===================================================== */

svg.addEventListener(
    "dblclick",
    function(e){

        e.preventDefault();


        const p=
            obtenerPuntoSVG(
                e.clientX,
                e.clientY
            );


        hacerZoom(
            1.5,
            p.x,
            p.y
        );

    }
);


/* =====================================================
   PINCH ZOOM
===================================================== */

svg.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.pointerType!=="touch"
        )
            return;


        if(
            dedos.size===2
        ){

            const lista=
                [
                    ...dedos.values()
                ];


            const a=lista[0];

            const b=lista[1];


            const distancia=
                Math.hypot(
                    a.x-b.x,
                    a.y-b.y
                );


            const centroX=
                (
                    a.x+b.x
                )/2;


            const centroY=
                (
                    a.y+b.y
                )/2;


            const punto=
                obtenerPuntoSVG(
                    centroX,
                    centroY
                );


            pinch={

                distancia,

                puntoX:punto.x,

                puntoY:punto.y,

                vistaX:vista.x,

                vistaY:vista.y,

                vistaW:vista.w,

                vistaH:vista.h

            };


            mapaPointer=null;

        }

    }
);


svg.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerType!=="touch"
        )
            return;


        if(
            dedos.has(
                e.pointerId
            )
        ){

            dedos.set(
                e.pointerId,
                {
                    x:e.clientX,
                    y:e.clientY
                }
            );

        }


        if(
            dedos.size!==2 ||
            !pinch
        )
            return;


        const lista=
            [
                ...dedos.values()
            ];


        const a=lista[0];

        const b=lista[1];


        const distancia=
            Math.hypot(
                a.x-b.x,
                a.y-b.y
            );


        if(!distancia)
            return;


        const factor=
            distancia/
            pinch.distancia;


        const nuevoW=
            pinch.vistaW/
            factor;


        const nuevoH=
            pinch.vistaH/
            factor;


        vista.w=
            nuevoW;


        vista.h=
            nuevoH;


        vista.x=
            pinch.puntoX-
            (
                pinch.puntoX-
                pinch.vistaX
            )*
            (
                nuevoW/
                pinch.vistaW
            );


        vista.y=
            pinch.puntoY-
            (
                pinch.puntoY-
                pinch.vistaY
            )*
            (
                nuevoH/
                pinch.vistaH
            );


        limitarVista();

        aplicarVista();


        e.preventDefault();

    },
    {passive:false}
);


function terminarDedo(e){

    dedos.delete(
        e.pointerId
    );


    if(
        dedos.size<2
    ){

        pinch=null;

    }

}


svg.addEventListener(
    "pointerup",
    terminarDedo
);


svg.addEventListener(
    "pointercancel",
    terminarDedo
);

/* =====================================================
   CREAR NOMBRES
===================================================== */

function crearPiezas(){

    )

/* =====================================================
   COMENZAR ARRASTRE
===================================================== */

function comenzarArrastre(e){

    if(!juegoActivo)
        return;


    e.stopPropagation();


    const codigo=
        this.dataset.codigo;


    const punto=
        obtenerPuntoSVG(
            e.clientX,
            e.clientY
        );


    const grupo=
        document.createElementNS(
            SVG_NS,
            "g"
        );


    const texto=
        document.createElementNS(
            SVG_NS,
            "text"
        );


    texto.textContent=
        paises[codigo];


    texto.classList.add(
        "nombrePais"
    );


    texto.setAttribute(
        "text-anchor",
        "middle"
    );


    texto.setAttribute(
        "dominant-baseline",
        "middle"
    );


    grupo.appendChild(
        texto
    );


    grupo.dataset.codigo=
        codigo;


    grupo.dataset.x=
        punto.x;


    grupo.dataset.y=
        punto.y;


    grupo.setAttribute(
        "transform",
        `translate(
            ${punto.x},
            ${punto.y}
        )`
    );


    svg.appendChild(
        grupo
    );


    this.classList.add(
        "oculto"
    );


    arrastre={

        grupo,

        panel:this,

        codigo,

        inicioX:e.clientX,

        inicioY:e.clientY,

        mapaX:punto.x,

        mapaY:punto.y,

        paisAnterior:null

    };


    document.addEventListener(
        "pointermove",
        moverArrastre
    );


    document.addEventListener(
        "pointerup",
        terminarArrastre,
        {once:true}
    );


    e.preventDefault();

}


/* =====================================================
   MOVER NOMBRE
===================================================== */

function moverArrastre(e){

    if(!arrastre)
        return;


    const rect=
        svg.getBoundingClientRect();


    const dx=
        (
            e.clientX-
            arrastre.inicioX
        )*
        vista.w/
        rect.width;


    const dy=
        (
            e.clientY-
            arrastre.inicioY
        )*
        vista.h/
        rect.height;


    const x=
        arrastre.mapaX+
        dx;


    const y=
        arrastre.mapaY+
        dy;


    arrastre.grupo.dataset.x=x;

    arrastre.grupo.dataset.y=y;


    arrastre.grupo.setAttribute(
        "transform",
        `translate(${x},${y})`
    );


    /*
       ==================================================
       NUEVO:
       Detectamos el país debajo del nombre
       y lo pintamos de GRIS.
       ==================================================
    */

    const paisActual=
        detectarPaisBajoNombre(
            x,
            y
        );


    /*
       Si cambiamos de país,
       quitamos el gris anterior.
    */

    if(
        arrastre.paisAnterior &&
        arrastre.paisAnterior!==paisActual
    ){

        const anterior=
            document.querySelector(
                `.destino[data-codigo="${arrastre.paisAnterior}"]`
            );


        if(anterior){

            anterior.classList.remove(
                "arrastre"
            );

        }

    }


    /*
       Pintamos el nuevo país
       de gris.
    */

    if(paisActual){

        const destino=
            document.querySelector(
                `.destino[data-codigo="${paisActual}"]`
            );


        if(
            destino &&
            !destino.classList.contains(
                "correcto"
            )
        ){

            destino.classList.add(
                "arrastre"
            );

        }

    }


    arrastre.paisAnterior=
        paisActual;


    e.preventDefault();

}


/* =====================================================
   SOLTAR NOMBRE
===================================================== */

function terminarArrastre(){

    if(!arrastre)
        return;


    document.removeEventListener(
        "pointermove",
        moverArrastre
    );


    const codigo=
        arrastre.codigo;


    const x=
        Number(
            arrastre.grupo.dataset.x
        );


    const y=
        Number(
            arrastre.grupo.dataset.y
        );


    /*
       País sobre el que se soltó.
    */

    const paisColocado=
        detectarPaisBajoNombre(
            x,
            y
        );


    /*
       Quitar todos los grises.
    */

    document
    .querySelectorAll(
        ".destino.arrastre"
    )
    .forEach(
        elemento=>{

            elemento.classList.remove(
                "arrastre"
            );

        }
    );


    /*
       ¿Correcto?
    */

    if(
        paisColocado===codigo
    ){

        acertar(codigo);


    }else{

        fallar(

            codigo,

            paisColocado

        );

    }


    if(
        arrastre.grupo.parentNode
    ){

        arrastre.grupo.remove();

    }


    arrastre=null;

}


/* =====================================================
   ACIERTO
===================================================== */

function acertar(codigo){

    aciertos++;


    document
    .getElementById("aciertos")
    .textContent=
        aciertos;


    const destino=
        document.querySelector(
            `.destino[data-codigo="${codigo}"]`
        );


    if(destino){

        destino.classList.add(
            "correcto"
        );

    }


    mostrarMensaje(

        "🔵 "+
        paises[codigo]+
        " ¡Correcto!"

    );


    if(
        aciertos===
        Object.keys(
            paises
        ).length
    ){

        terminarJuego(true);

    }

}


/* =====================================================
   ERROR
===================================================== */

function fallar(
    codigo,
    paisColocado
){

    errores++;


    /*
       Guardamos exactamente qué pasó.
    */

    detallesErrores.push({

        codigo,

        correcto:
            paises[codigo],

        colocado:
            paisColocado
            ?
            paises[paisColocado]
            :
            "Fuera de un país"

    });


    /*
       El nombre vuelve al panel.
    */

    if(
        arrastre &&
        arrastre.panel
    ){

        arrastre.panel.classList.remove(
            "oculto"
        );

    }


    mostrarMensaje(

        "❌ "+
        paises[codigo]+
        " no corresponde ahí"

    );

}


/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(
    texto
){

    const elemento=
        document.getElementById(
            "mensaje"
        );


    elemento.textContent=
        texto;


    elemento.style.display=
        "block";


    clearTimeout(
        elemento._timer
    );


    elemento._timer=
        setTimeout(
            ()=>{

                elemento.style.display=
                    "none";

            },

            1000

        );

}


/* =====================================================
   TIEMPO
===================================================== */

function actualizarTemporizador(){

    if(!juegoActivo)
        return;


    segundos--;


    actualizarTiempo();


    if(
        segundos<=20
    ){

        document
        .getElementById("tiempo")
        .classList.add(
            "critico"
        );

    }


    if(
        segundos<=0
    ){

        terminarJuego(false);

    }

}


function actualizarTiempo(){

    document
    .getElementById("tiempo")
    .textContent=

        Math.floor(
            segundos/60
        )+

        ":"+

        String(
            segundos%60
        ).padStart(
            2,
            "0"
        );

}


/* =====================================================
   FINAL
===================================================== */

function terminarJuego(
    gano
){

    juegoActivo=false;


    clearInterval(
        timer
    );


    const todos=
        Object.keys(
            paises
        );


    const correctos=
        todos.filter(
            codigo=>{

                const destino=
                    document.querySelector(
                        `.destino[data-codigo="${codigo}"]`
                    );


                return(

                    destino &&

                    destino.classList.contains(
                        "correcto"
                    )

                );

            }
        );


    const incorrectos=
        todos.filter(
            codigo=>
                !correctos.includes(
                    codigo
                )
        );


    document
    .getElementById("tituloFinal")
    .textContent=

        gano

        ?

        "🏆 ¡Nivel superado!"

        :

        "⏰ ¡Tiempo terminado!";


    document
    .getElementById(
        "cantidadAciertos"
    )
    .textContent=
        aciertos;


    document
    .getElementById(
        "cantidadErrores"
    )
    .textContent=
        errores;


    const usado=
        120-segundos;


    document
    .getElementById(
        "tiempoFinal"
    )
    .textContent=

        Math.floor(
            usado/60
        )+

        ":"+

        String(
            usado%60
        ).padStart(
            2,
            "0"
        );


    /*
       =================================================
       PAÍSES CORRECTOS
       =================================================
    */

    document
    .getElementById(
        "listaAciertos"
    )
    .innerHTML=

        "<strong>"+
        "🔵 Países correctos"+
        "</strong><br><br>"+

        (

            correctos.length

            ?

            correctos
            .map(
                codigo=>
                    "• "+
                    paises[codigo]
            )
            .join("<br>")

            :

            "Ninguno"

        );


    /*
       =================================================
       DETALLE DE ERRORES
       =================================================
    */

    let htmlErrores=

        "<strong>"+
        "❌ Detalle de errores"+
        "</strong><br><br>";


    if(
        detallesErrores.length===0
    ){

        htmlErrores+=
            "No hubo errores.";

    }else{

        detallesErrores.forEach(
            (error,index)=>{

                htmlErrores+=

                `<div class="detalleError">

                <strong>
                Error ${index+1}
                </strong>
                <br>

                🏳️ País buscado:
                <strong>
                ${error.correcto}
                </strong>

                <br>

                📍 Lo colocaste sobre:
                <strong>
                ${error.colocado}
                </strong>

                </div>`;

            }
        );

    }


    /*
       Países que quedaron sin colocar.
    */

    const sinColocar=
        incorrectos.filter(
            codigo=>
                !detallesErrores.some(
                    error=>
                        error.codigo===
                        codigo
                )
        );


    if(
        sinColocar.length
    ){

        htmlErrores+=

        "<br><strong>"+
        "⏳ Sin colocar:"+
        "</strong><br><br>"+

        sinColocar
        .map(
            codigo=>
                "• "+
                paises[codigo]
        )
        .join("<br>");

    }


    document
    .getElementById(
        "listaErrores"
    )
    .innerHTML=
        htmlErrores;


    document
    .getElementById(
        "final"
    )
    .style.display=
        "flex";

}

/* =====================================================
   CONVERTIR SVG → GEO
===================================================== */

function convertirSVGaGeo(
    x,
    y
){

    const t=
        transformacion;


    return {

        lon:

            t.minLon+

            (
                x-
                t.offsetX
            )/
            t.escala,


        lat:

            t.minLat+

            (
                ALTO-
                y-
                t.offsetY
            )/
            t.escala

    };

}


/* =====================================================
   PUNTO EN POLÍGONO
===================================================== */

function puntoEnPoligono(
    lon,
    lat,
    ring
){

    let dentro=false;


    for(

        let i=0,
            j=ring.length-1;

        i<ring.length;

        j=i++

    ){

        const xi=
            ring[i][0];

        const yi=
            ring[i][1];

        const xj=
            ring[j][0];

        const yj=
            ring[j][1];


        const intersecta=

            (
                (yi>lat)
                !==
                (yj>lat)
            )

            &&

            (

                lon<

                (xj-xi)*
                (lat-yi)/
                (yj-yi)+
                xi

            );


        if(intersecta)
            dentro=!dentro;

    }


    return dentro;

}


/* =====================================================
   PUNTO EN GEOMETRÍA
===================================================== */

function puntoEnGeometry(
    lon,
    lat,
    geometry
){

    if(!geometry)
        return false;


    function poligono(
        p
    ){

        if(
            !puntoEnPoligono(
                lon,
                lat,
                p[0]
            )
        )
            return false;


        /*
           Agujeros internos.
        */

        for(
            let i=1;
            i<p.length;
            i++
        ){

            if(
                puntoEnPoligono(
                    lon,
                    lat,
                    p[i]
                )
            ){

                return false;

            }

        }


        return true;

    }


    if(
        geometry.type===
        "Polygon"
    ){

        return poligono(
            geometry.coordinates
        );

    }


    if(
        geometry.type===
        "MultiPolygon"
    ){

        return geometry.coordinates
        .some(
            poligono
        );

    }


    return false;

}
